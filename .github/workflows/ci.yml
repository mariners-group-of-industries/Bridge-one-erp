name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # postinstall runs `prisma generate`; no database is needed for any step
      # (tests use in-process PGlite, the Prisma client connects lazily).
      - run: npm ci
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
